[project]
name = "excavate-platform"
version = "0.0.1"
description = "Digital archaeology platform — Wayback resurrection + corpus-to-narrative story sites (working title)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.scripts]
excavate = "excavate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/excavate"]
